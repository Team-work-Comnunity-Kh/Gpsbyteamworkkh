name: smartgps
description: SmartGPS user app for GPS tracking and land measurement.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.10
  go_router: ^13.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  google_fonts: ^6.1.0
  intl: ^0.20.3
  flutter_compass: ^0.8.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
