services:
  # PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: smartgps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-smartgps_db}
      POSTGRES_USER: ${DATABASE_USER:-smartgps}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-smartgps123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - smartgps_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-smartgps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: smartgps_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - smartgps_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-redis123}' ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartgps_backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-smartgps}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-smartgps123}
      DATABASE_NAME: ${DATABASE_NAME:-smartgps_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-your_refresh_token_secret_change_in_production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smartgps.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      # Local Compose runs with TypeORM schema sync enabled. Set NODE_ENV=production
      # only after applying the database migrations in a production environment.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartgps_network

  # Admin Dashboard
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: smartgps_admin
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ws://localhost:3000
    ports:
      - "5173:8080"
    depends_on:
      - backend
    networks:
      - smartgps_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartgps_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - admin
    networks:
      - smartgps_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  smartgps_network:
    driver: bridge
